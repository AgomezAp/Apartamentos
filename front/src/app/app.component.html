<div class="app-layout">
  <!-- Header Fijo - Solo si es ruta protegida -->
  <app-header 
    *ngIf="showNavigation"
    class="app-header"
    (toggleSidebar)="onToggleSidebar()"
  ></app-header>

  <div class="app-body">
    <!-- Sidebar Fijo - Solo si es ruta protegida -->
    <app-sidebar 
      *ngIf="showNavigation"
      class="app-sidebar"
      [collapsed]="sidebarCollapsed"
    ></app-sidebar>

    <!-- Contenido Principal - Scroll Natural -->
    <main [ngClass]="{'app-main': showNavigation, 'app-main-full': !showNavigation}">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
