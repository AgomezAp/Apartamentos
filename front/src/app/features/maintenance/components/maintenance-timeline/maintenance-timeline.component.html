<div class="maintenance-timeline">
  <div class="timeline-header">
    <h3>🕒 Historial de la Solicitud</h3>
  </div>

  <div class="timeline-content">
    <div class="timeline-list">
      <div class="timeline-item" *ngFor="let event of timelineEvents; let first = first" [ngClass]="getEventClass(event.type)">
        <div class="timeline-marker" [class.first]="first">
          <span class="marker-icon">{{ getEventIcon(event.type) }}</span>
        </div>
        
        <div class="timeline-content-item">
          <div class="event-header">
            <h4 class="event-title">{{ event.event }}</h4>
            <span class="event-date">{{ formatDate(event.date) }}</span>
          </div>
          
          <p class="event-description">{{ event.description }}</p>
          
          <p class="event-user" *ngIf="event.user">
            👤 {{ event.user }}
          </p>
        </div>
      </div>
    </div>

    <div class="no-events" *ngIf="timelineEvents.length === 0">
      <p>No hay eventos registrados</p>
    </div>
  </div>
</div>
