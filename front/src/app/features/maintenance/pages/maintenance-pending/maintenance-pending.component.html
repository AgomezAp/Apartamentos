<div class="maintenance-pending-container">
  <div class="page-header">
    <div class="header-content">
      <h1>⏳ Solicitudes Pendientes</h1>
      <p>Todas las solicitudes de mantenimiento que aún no han sido asignadas o iniciadas</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" [routerLink]="['/maintenance']">
        ← Volver
      </button>
      <button class="btn btn-primary" [routerLink]="['/maintenance/create']">
        ➕ Nueva Solicitud
      </button>
    </div>
  </div>

  <!-- Summary Bar -->
  <div class="summary-bar">
    <div class="summary-item">
      <span class="summary-label">Total Pendientes:</span>
      <span class="summary-value">{{ requests.length }}</span>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="loading">
    <p>⏳ Cargando solicitudes pendientes...</p>
  </div>

  <!-- Requests Grid -->
  <div class="requests-grid" *ngIf="!loading && requests.length > 0">
    <app-maintenance-card
      *ngFor="let request of requests"
      [request]="request"
      (delete)="onDelete(request.request_id)"
      (resolve)="onResolve(request.request_id)"
      (assign)="onAssign(request.request_id)">
    </app-maintenance-card>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && requests.length === 0">
    <div class="empty-icon">✅</div>
    <h3>No hay solicitudes pendientes</h3>
    <p>Todas las solicitudes han sido asignadas o resueltas</p>
  </div>
</div>
