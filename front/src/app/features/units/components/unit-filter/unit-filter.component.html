<div class="unit-filter">
  <div class="filter-header">
    <h3>Filtros</h3>
    <button *ngIf="hasActiveFilters()" class="btn-clear" (click)="clearFilters()">
      Limpiar filtros
    </button>
  </div>

  <div class="filter-grid">
    <!-- Edificio -->
    <div class="filter-group">
      <label for="building">Edificio</label>
      <select id="building" [(ngModel)]="filter.building_id" (change)="onFilterChange()" class="form-control">
        <option [value]="undefined">Todos los edificios</option>
        <option *ngFor="let building of buildings" [value]="building.id">
          {{ building.name }}
        </option>
      </select>
    </div>

    <!-- Estado -->
    <div class="filter-group">
      <label for="status">Estado</label>
      <select id="status" [(ngModel)]="filter.status" (change)="onFilterChange()" class="form-control">
        <option *ngFor="let option of statusOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <!-- Habitaciones -->
    <div class="filter-group">
      <label for="bedrooms">Habitaciones</label>
      <select id="bedrooms" [(ngModel)]="filter.bedrooms" (change)="onFilterChange()" class="form-control">
        <option *ngFor="let option of bedroomOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <!-- Renta mínima -->
    <div class="filter-group">
      <label for="minRent">Renta mínima</label>
      <input 
        type="number" 
        id="minRent" 
        [(ngModel)]="filter.min_rent" 
        (change)="onFilterChange()" 
        class="form-control"
        placeholder="$0"
      >
    </div>

    <!-- Renta máxima -->
    <div class="filter-group">
      <label for="maxRent">Renta máxima</label>
      <input 
        type="number" 
        id="maxRent" 
        [(ngModel)]="filter.max_rent" 
        (change)="onFilterChange()" 
        class="form-control"
        placeholder="$10,000"
      >
    </div>

    <!-- Amueblado -->
    <div class="filter-group">
      <label for="furnished">Amueblado</label>
      <select id="furnished" [(ngModel)]="filter.furnished" (change)="onFilterChange()" class="form-control">
        <option [value]="undefined">Todos</option>
        <option [value]="true">Sí</option>
        <option [value]="false">No</option>
      </select>
    </div>
  </div>
</div>
