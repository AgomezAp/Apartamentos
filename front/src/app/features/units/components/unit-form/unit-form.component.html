<form [formGroup]="unitForm" (ngSubmit)="onSubmit()" class="unit-form">
  <div class="form-grid">
    <!-- Edificio -->
    <div class="form-group">
      <label for="building_id">Edificio *</label>
      <select 
        id="building_id" 
        formControlName="building_id" 
        class="form-control"
        [class.is-invalid]="isFieldInvalid('building_id')"
      >
        <option value="">Seleccione un edificio</option>
        <option *ngFor="let building of buildings" [value]="building.id">
          {{ building.name }}
        </option>
      </select>
      <div class="error-message" *ngIf="isFieldInvalid('building_id')">
        {{ getFieldError('building_id') }}
      </div>
    </div>

    <!-- Número de unidad -->
    <div class="form-group">
      <label for="unit_number">Número de Unidad *</label>
      <input 
        type="text" 
        id="unit_number" 
        formControlName="unit_number" 
        class="form-control"
        [class.is-invalid]="isFieldInvalid('unit_number')"
        placeholder="Ej: 101, A-201"
      >
      <div class="error-message" *ngIf="isFieldInvalid('unit_number')">
        {{ getFieldError('unit_number') }}
      </div>
    </div>

    <!-- Piso -->
    <div class="form-group">
      <label for="floor">Piso</label>
      <input 
        type="number" 
        id="floor" 
        formControlName="floor" 
        class="form-control"
        placeholder="Ej: 1, 2, 3"
        appNumberOnly
      >
    </div>

    <!-- Tipo de Unidad -->
    <div class="form-group">
      <label for="unit_type_id">Tipo de Unidad *</label>
      <select 
        id="unit_type_id" 
        formControlName="unit_type_id" 
        class="form-control"
        [class.is-invalid]="isFieldInvalid('unit_type_id')"
      >
        <option value="">Seleccione un tipo</option>
        <option *ngFor="let type of unitTypes" [value]="type.id">
          {{ type.name }}
        </option>
      </select>
      <div class="error-message" *ngIf="isFieldInvalid('unit_type_id')">
        {{ getFieldError('unit_type_id') }}
      </div>
    </div>

    <!-- Estado -->
    <div class="form-group">
      <label for="status">Estado *</label>
      <select 
        id="status" 
        formControlName="status" 
        class="form-control"
        [class.is-invalid]="isFieldInvalid('status')"
      >
        <option *ngFor="let option of statusOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <div class="error-message" *ngIf="isFieldInvalid('status')">
        {{ getFieldError('status') }}
      </div>
    </div>

    <!-- Habitaciones -->
    <div class="form-group">
      <label for="bedrooms">Habitaciones</label>
      <input 
        type="number" 
        id="bedrooms" 
        formControlName="bedrooms" 
        class="form-control"
        placeholder="Ej: 2"
        min="0"
        appNumberOnly
      >
    </div>

    <!-- Baños -->
    <div class="form-group">
      <label for="bathrooms">Baños</label>
      <input 
        type="number" 
        id="bathrooms" 
        formControlName="bathrooms" 
        class="form-control"
        placeholder="Ej: 1"
        min="0"
        appNumberOnly
      >
    </div>

    <!-- Área -->
    <div class="form-group">
      <label for="area_sqm">Área (m²)</label>
      <input 
        type="text" 
        id="area_sqm" 
        formControlName="area_sqm" 
        class="form-control"
        placeholder="Ej: 75"
        appNumberFormat
      >
    </div>

    <!-- Renta mensual -->
    <div class="form-group">
      <label for="monthly_rent">Renta Mensual</label>
      <input 
        type="text" 
        id="monthly_rent" 
        formControlName="monthly_rent" 
        class="form-control"
        placeholder="Ej: 800000"
        appNumberFormat
      >
    </div>

    <!-- Depósito -->
    <div class="form-group">
      <label for="deposit_required">Depósito Requerido</label>
      <input 
        type="text" 
        id="deposit_required" 
        formControlName="deposit_required" 
        class="form-control"
        placeholder="Ej: 1600000"
        appNumberFormat
      >
    </div>

    <!-- Amueblado -->
    <div class="form-group checkbox-group">
      <label>
        <input 
          type="checkbox" 
          formControlName="furnished"
        >
        <span>Amueblado</span>
      </label>
    </div>
  </div>

  <!-- Descripción -->
  <div class="form-group full-width">
    <label for="description">Descripción</label>
    <textarea 
      id="description" 
      formControlName="description" 
      class="form-control"
      rows="4"
      placeholder="Descripción de la unidad..."
    ></textarea>
  </div>

  <!-- Botones -->
  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="unitForm.invalid">
      {{ submitButtonText }}
    </button>
  </div>
</form>
