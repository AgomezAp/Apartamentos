<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1>Recuperar Contraseña</h1>
      <p>Te enviaremos un enlace para restablecer tu contraseña</p>
    </div>

    <!-- Email Sent Success -->
    <div class="success-message" *ngIf="emailSent">
      <div class="success-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3>¡Email Enviado!</h3>
      <p>
        Hemos enviado un enlace de recuperación a tu correo electrónico.
        Por favor revisa tu bandeja de entrada y spam.
      </p>
      <button type="button" class="btn-secondary" (click)="backToLogin()">
        <i class="fa-solid fa-arrow-left"></i>
        Volver al Login
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!emailSent">
      <!-- Email -->
      <div class="form-group">
        <label for="email">
          <i class="fa-solid fa-envelope"></i>
          Correo Electrónico
        </label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.error]="hasError('email', 'required') || hasError('email', 'email')"
        />
        <span class="error-message" *ngIf="getErrorMessage('email')">
          {{ getErrorMessage('email') }}
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">
          <i class="fa-solid fa-paper-plane"></i>
          Enviar Enlace de Recuperación
        </span>
        <span *ngIf="isLoading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Enviando...
        </span>
      </button>

      <!-- Back to Login Link -->
      <div class="form-footer">
        <p>
          ¿Recordaste tu contraseña?
          <a routerLink="/auth/login" class="link">Volver al login</a>
        </p>
      </div>
    </form>
  </div>
</div>
