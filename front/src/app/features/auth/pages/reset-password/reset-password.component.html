<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="fa-solid fa-lock-open"></i>
      </div>
      <h1>Restablecer Contraseña</h1>
      <p>Ingresa tu nueva contraseña</p>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Password -->
      <div class="form-group">
        <label for="password">
          <i class="fa-solid fa-lock"></i>
          Nueva Contraseña
        </label>
        <div class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="••••••••"
            [class.error]="hasError('password', 'required') || hasError('password', 'minlength')"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility('password')"
            tabindex="-1"
          >
            <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
        <span class="error-message" *ngIf="getErrorMessage('password')">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">
          <i class="fa-solid fa-lock"></i>
          Confirmar Contraseña
        </label>
        <div class="password-input">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="••••••••"
            [class.error]="hasError('confirmPassword', 'required') || hasError('confirmPassword', 'passwordMismatch')"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility('confirmPassword')"
            tabindex="-1"
          >
            <i [class]="showConfirmPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
        <span class="error-message" *ngIf="getErrorMessage('confirmPassword')">
          {{ getErrorMessage('confirmPassword') }}
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">
          <i class="fa-solid fa-check"></i>
          Restablecer Contraseña
        </span>
        <span *ngIf="isLoading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Procesando...
        </span>
      </button>

      <!-- Login Link -->
      <div class="form-footer">
        <p>
          ¿Recordaste tu contraseña?
          <a routerLink="/auth/login" class="link">Volver al login</a>
        </p>
      </div>
    </form>
  </div>
</div>
