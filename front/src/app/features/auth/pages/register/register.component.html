<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Regístrate para comenzar a gestionar tus propiedades</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Fila 1: Nombre y Email -->
      <div class="form-row">
        <!-- Full Name -->
        <div class="form-group">
          <label for="full_name">
            <i class="fa-solid fa-user"></i>
            Nombre Completo
          </label>
          <input
            type="text"
            id="full_name"
            formControlName="full_name"
            placeholder="Juan Pérez"
            [class.error]="
              hasError('full_name', 'required') ||
              hasError('full_name', 'minlength')
            "
          />
          <span class="error-message" *ngIf="getErrorMessage('full_name')">
            {{ getErrorMessage("full_name") }}
          </span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            <i class="fa-solid fa-envelope"></i>
            Correo Electrónico
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="tu@email.com"
            [class.error]="
              hasError('email', 'required') || hasError('email', 'email')
            "
          />
          <span class="error-message" *ngIf="getErrorMessage('email')">
            {{ getErrorMessage("email") }}
          </span>
        </div>
      </div>
      <!-- Fila 3: Contraseñas -->
      <div class="form-row">
        <!-- Password -->
        <div class="form-group">
          <label for="password">
            <i class="fa-solid fa-lock"></i>
            Contraseña
          </label>
          <div class="password-input">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              [class.error]="
                hasError('password', 'required') ||
                hasError('password', 'minlength')
              "
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('password')"
              tabindex="-1"
            >
              <i
                [class]="
                  showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'
                "
              ></i>
            </button>
          </div>
          <span class="error-message" *ngIf="getErrorMessage('password')">
            {{ getErrorMessage("password") }}
          </span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">
            <i class="fa-solid fa-lock"></i>
            Confirmar Contraseña
          </label>
          <div class="password-input">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="••••••••"
              [class.error]="
                hasError('confirmPassword', 'required') ||
                hasError('confirmPassword', 'passwordMismatch')
              "
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('confirmPassword')"
              tabindex="-1"
            >
              <i
                [class]="
                  showConfirmPassword
                    ? 'fa-solid fa-eye-slash'
                    : 'fa-solid fa-eye'
                "
              ></i>
            </button>
          </div>
          <span
            class="error-message"
            *ngIf="getErrorMessage('confirmPassword')"
          >
            {{ getErrorMessage("confirmPassword") }}
          </span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">
          <i class="fa-solid fa-user-plus"></i>
          Crear Cuenta
        </span>
        <span *ngIf="isLoading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Creando cuenta...
        </span>
      </button>

      <!-- Login Link -->
      <div class="form-footer">
        <p>
          ¿Ya tienes cuenta?
          <a routerLink="/auth/login" class="link">Inicia sesión aquí</a>
        </p>
      </div>
    </form>
  </div>
</div>
