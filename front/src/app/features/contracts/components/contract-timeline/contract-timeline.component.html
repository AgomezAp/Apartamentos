<div class="contract-timeline">
  <h3>Línea de Tiempo del Contrato</h3>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let event of timelineEvents" 
         [class.past]="event.isPast"
         [class.current]="event.isCurrent">
      <div class="timeline-marker">
        <span class="timeline-icon">{{ getEventIcon(event.type) }}</span>
      </div>
      <div class="timeline-content">
        <div class="timeline-date">{{ formatEventDate(event.date) }}</div>
        <div class="timeline-title">{{ event.title }}</div>
        <div class="timeline-description">{{ event.description }}</div>
      </div>
    </div>
  </div>

  <div class="timeline-empty" *ngIf="timelineEvents.length === 0">
    <p>No hay eventos en la línea de tiempo</p>
  </div>
</div>
