<div class="chart-viewer">
  <div class="chart-header" *ngIf="title">
    <h3>{{ title }}</h3>
  </div>

  <div class="chart-container" [style.height.px]="height">
    <!-- Bar Chart -->
    <div class="bar-chart" *ngIf="chartData.type === 'bar'">
      <div class="chart-content">
        <div class="bar-group" *ngFor="let label of chartData.labels; let i = index">
          <div class="bars">
            <div 
              class="bar"
              *ngFor="let dataset of chartData.datasets; let di = index"
              [style.height.%]="getBarHeight(dataset.data[i])"
              [style.backgroundColor]="getColor(i, di)"
              [title]="dataset.label + ': ' + formatNumber(dataset.data[i])">
              <span class="bar-value">{{ formatNumber(dataset.data[i]) }}</span>
            </div>
          </div>
          <div class="bar-label">{{ label }}</div>
        </div>
      </div>
    </div>

    <!-- Pie Chart -->
    <div class="pie-chart" *ngIf="chartData.type === 'pie' || chartData.type === 'doughnut'">
      <div class="pie-container">
        <svg viewBox="0 0 200 200">
          <g transform="translate(100, 100)">
            <circle
              *ngFor="let value of chartData.datasets[0].data; let i = index"
              [attr.r]="chartData.type === 'doughnut' ? '60' : '80'"
              [attr.stroke]="getColor(i)"
              [attr.stroke-width]="chartData.type === 'doughnut' ? '40' : '160'"
              [attr.stroke-dasharray]="getArcLength(value) + ' ' + (2 * Math.PI * 80)"
              [attr.stroke-dashoffset]="getArcOffset(i)"
              fill="none"
              transform="rotate(-90)"
            />
          </g>
        </svg>
        <div class="pie-center" *ngIf="chartData.type === 'doughnut'">
          <strong>{{ formatNumber(getTotalValue()) }}</strong>
          <span>Total</span>
        </div>
      </div>
      <div class="pie-legend">
        <div class="legend-item" *ngFor="let label of chartData.labels; let i = index">
          <span class="legend-color" [style.backgroundColor]="getColor(i)"></span>
          <span class="legend-label">{{ label }}</span>
          <span class="legend-value">{{ formatNumber(chartData.datasets[0].data[i]) }}</span>
          <span class="legend-percentage">({{ getPercentage(chartData.datasets[0].data[i]).toFixed(1) }}%)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Legend for Bar Charts -->
  <div class="chart-legend" *ngIf="chartData.type === 'bar' && chartData.datasets.length > 1">
    <div class="legend-item" *ngFor="let dataset of chartData.datasets; let i = index">
      <span class="legend-color" [style.backgroundColor]="getColor(0, i)"></span>
      <span class="legend-label">{{ dataset.label }}</span>
    </div>
  </div>
</div>
