<div class="expense-form-container">
  <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <!-- Edificio -->
      <div class="form-group">
        <label for="building_id">🏢 Edificio *</label>
        <select 
          id="building_id" 
          formControlName="building_id"
          class="form-control"
          [class.error]="expenseForm.get('building_id')?.invalid && expenseForm.get('building_id')?.touched">
          <option value="">Seleccione un edificio</option>
          <option *ngFor="let building of buildings" [value]="building.id">
            {{ building.name }}
          </option>
        </select>
        <span class="error-message" *ngIf="expenseForm.get('building_id')?.invalid && expenseForm.get('building_id')?.touched">
          {{ getFieldError('building_id') }}
        </span>
      </div>

      <!-- Categoría -->
      <div class="form-group">
        <label for="category_id">📊 Categoría *</label>
        <select 
          id="category_id" 
          formControlName="category_id"
          class="form-control"
          [class.error]="expenseForm.get('category_id')?.invalid && expenseForm.get('category_id')?.touched">
          <option value="">Seleccione una categoría</option>
          <option *ngFor="let category of categories" [value]="category.category_id">
            {{ category.category_name }}
          </option>
        </select>
        <span class="error-message" *ngIf="expenseForm.get('category_id')?.invalid && expenseForm.get('category_id')?.touched">
          {{ getFieldError('category_id') }}
        </span>
      </div>

      <!-- Descripción -->
      <div class="form-group full-width">
        <label for="description">📝 Descripción *</label>
        <input 
          type="text" 
          id="description" 
          formControlName="description"
          class="form-control"
          placeholder="Descripción del gasto"
          [class.error]="expenseForm.get('description')?.invalid && expenseForm.get('description')?.touched">
        <span class="error-message" *ngIf="expenseForm.get('description')?.invalid && expenseForm.get('description')?.touched">
          {{ getFieldError('description') }}
        </span>
      </div>

      <!-- Monto -->
      <div class="form-group">
        <label for="amount">💰 Monto *</label>
        <input 
          type="number" 
          id="amount" 
          formControlName="amount"
          class="form-control"
          placeholder="0.00"
          step="0.01"
          min="0"
          [class.error]="expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched">
        <span class="error-message" *ngIf="expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched">
          {{ getFieldError('amount') }}
        </span>
      </div>

      <!-- Fecha -->
      <div class="form-group">
        <label for="expense_date">📅 Fecha de Gasto *</label>
        <input 
          type="date" 
          id="expense_date" 
          formControlName="expense_date"
          class="form-control"
          [class.error]="expenseForm.get('expense_date')?.invalid && expenseForm.get('expense_date')?.touched">
        <span class="error-message" *ngIf="expenseForm.get('expense_date')?.invalid && expenseForm.get('expense_date')?.touched">
          {{ getFieldError('expense_date') }}
        </span>
      </div>

      <!-- Método de Pago -->
      <div class="form-group">
        <label for="payment_method">💳 Método de Pago *</label>
        <select 
          id="payment_method" 
          formControlName="payment_method"
          class="form-control">
          <option *ngFor="let method of paymentMethods" [value]="method.value">
            {{ method.label }}
          </option>
        </select>
      </div>

      <!-- Número de Referencia -->
      <div class="form-group">
        <label for="reference_number">🔢 Número de Referencia</label>
        <input 
          type="text" 
          id="reference_number" 
          formControlName="reference_number"
          class="form-control"
          placeholder="Número de cheque, transferencia, etc.">
      </div>

      <!-- Notas -->
      <div class="form-group full-width">
        <label for="notes">📝 Notas</label>
        <textarea 
          id="notes" 
          formControlName="notes"
          class="form-control"
          rows="3"
          placeholder="Notas adicionales sobre el gasto"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-cancel" (click)="onCancel()" [disabled]="loading">
        Cancelar
      </button>
      <button type="submit" class="btn btn-submit" [disabled]="loading || expenseForm.invalid">
        <span *ngIf="!loading">{{ expense ? 'Actualizar' : 'Crear' }} Gasto</span>
        <span *ngIf="loading">Guardando...</span>
      </button>
    </div>
  </form>
</div>
